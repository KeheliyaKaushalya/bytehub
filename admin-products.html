<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Products - ByteHub Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" type="text/css" href="css/style.css">
</head>
<body>
    <!--Header section-->
    <header class="header">
        <a href="index.html" class="logo"><i class="fa fa-desktop" aria-hidden="true"></i>ByteHub Admin</a>

        <nav class="navbar">
            <a href="index.html">View Site</a>
            <a href="admin.html">Dashboard</a>
        </nav>

        <div class="icons">
            <div class="fa fa-bars" id="menu-btn"></div>
            <div class="fa fa-sign-out" id="admin-logout-btn"></div>
        </div>
    </header>

    <!-- Admin Dashboard -->
    <div class="dashboard-grid">
        <div class="dashboard-sidebar">
            <h3>Admin Panel</h3>
            <a href="admin.html"><i class="fa fa-dashboard"></i> Dashboard</a>
            <a href="admin-products.html" class="active"><i class="fa fa-shopping-bag"></i> Products</a>
            <a href="admin-users.html"><i class="fa fa-users"></i> Users</a>
            <a href="admin-orders.html"><i class="fa fa-truck"></i> Orders</a>
            <a href="admin-faqs.html"><i class="fa fa-question-circle"></i> FAQs</a>
        </div>

        <div class="dashboard-content">
            <h2>Product Management</h2>
            <div id="admin-products-table">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Loading products...</p>
                </div>
            </div>
        </div>
    </div>

    <section class="Footer">
        <div class="credit"><p>&copy; 2024 ByteHub Admin. All Rights Reserved.</p></div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                const { data: profile } = await supabase.from('user_profiles').select('*').eq('id', session.user.id).single();
                if (!profile?.is_admin) {
                    window.location.href = 'index.html';
                    return;
                }
                loadAdminProducts();
            } else {
                window.location.href = 'index.html';
            }

            document.getElementById('admin-logout-btn').addEventListener('click', async () => {
                await supabase.auth.signOut();
                window.location.href = 'index.html';
            });
        });

        async function loadAdminProducts() {
            const { data, error } = await supabase.from('products').select('*, categories(name)');
            if (error) {
            showAlert('Could not load products: ' + error.message, 'error');
            return;
            }

            let html = `
                <button class="btn btn-primary" onclick="showProductModal()" style="margin-bottom: 2rem;">
                    <i class="fa fa-plus"></i> Add New Product
                </button>
                <div class="table-container">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Image</th>
                                <th>Name</th>
                                <th>Category</th>
                                <th>Price</th>
                                <th>Stock</th>
                                <th>Featured</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            data.forEach(product => {
                html += `
                    <tr>
                        <td><img src="${escapeHtml(product.image_url || 'https://placehold.co/60x60')}" alt="" style="width: 60px; height: 60px; object-fit: cover; border-radius: 5px;"></td>
                        <td>${escapeHtml(product.name)}</td>
                        <td>${product.categories?.name || 'N/A'}</td>
                        <td>Rs.${parseFloat(product.price).toLocaleString()}</td>
                        <td>${product.stock_quantity}</td>
                        <td>${product.featured ? '<span style="color: green;"><i class="fa fa-check"></i></span>' : '<span style="color: #999;"><i class="fa fa-times"></i></span>'}</td>
                        <td>
                            <div class="admin-table-actions">
                                <button class="btn btn-primary" onclick="editProductAdmin('${product.id}')" style="padding: 0.5rem 1rem;">Edit</button>
                                <button class="btn btn-danger" onclick="deleteProduct('${product.id}')" style="padding: 0.5rem 1rem;">Delete</button>
                            </div>
                        </td>
                    </tr>
                `;
            });

            html += '</tbody></table></div>';
            document.getElementById('admin-products-table').innerHTML = html;
        }

        function editProductAdmin(productId) {
        // Uses the shared modal from js/script.js (validation, error messages, category + featured)
        showProductModal(productId);
        }
    </script>
</body>
</html>
