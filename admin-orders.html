<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Orders - ByteHub Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" type="text/css" href="css/style.css">
</head>
<body>
    <!--Header section-->
    <header class="header">
        <a href="index.html" class="logo"><i class="fa fa-desktop" aria-hidden="true"></i>ByteHub Admin</a>

        <nav class="navbar">
            <a href="index.html">View Site</a>
            <a href="admin.html">Dashboard</a>
        </nav>

        <div class="icons">
            <div class="fa fa-bars" id="menu-btn"></div>
            <div class="fa fa-sign-out" id="admin-logout-btn"></div>
        </div>
    </header>

    <!-- Admin Dashboard -->
    <div class="dashboard-grid">
        <div class="dashboard-sidebar">
            <h3>Admin Panel</h3>
            <a href="admin.html"><i class="fa fa-dashboard"></i> Dashboard</a>
            <a href="admin-products.html"><i class="fa fa-shopping-bag"></i> Products</a>
            <a href="admin-users.html"><i class="fa fa-users"></i> Users</a>
            <a href="admin-orders.html" class="active"><i class="fa fa-truck"></i> Orders</a>
            <a href="admin-faqs.html"><i class="fa fa-question-circle"></i> FAQs</a>
        </div>

        <div class="dashboard-content">
            <h2>Order Management</h2>
            <div id="admin-orders-table">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Loading orders...</p>
                </div>
            </div>
        </div>
    </div>

    <section class="Footer">
        <div class="credit"><p>&copy; 2024 ByteHub Admin. All Rights Reserved.</p></div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                const { data: profile } = await supabase.from('user_profiles').select('*').eq('id', session.user.id).single();
                if (!profile?.is_admin) {
                    window.location.href = 'index.html';
                    return;
                }
                loadOrders();
            } else {
                window.location.href = 'index.html';
            }

            document.getElementById('admin-logout-btn').addEventListener('click', async () => {
                await supabase.auth.signOut();
                window.location.href = 'index.html';
            });
        });

        async function loadOrders() {
            const { data: orders, error } = await supabase
                .from('orders')
                .select('*, user_profiles(full_name, phone), order_items(*)')
                .order('created_at', { ascending: false });

            if (error || !orders) return;

            let html = `
                <div class="table-container">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Order ID</th>
                                <th>Customer</th>
                                <th>Items</th>
                                <th>Total</th>
                                <th>Status</th>
                                <th>Date</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            orders.forEach(order => {
                html += `
                    <tr>
                        <td><strong>${order.id.substring(0, 8).toUpperCase()}</strong></td>
                        <td>
                            ${order.user_profiles?.full_name || 'N/A'}<br>
                            <small style="color: var(--light-color);">${order.user_profiles?.phone || ''}</small>
                        </td>
                        <td>${order.order_items?.length || 0} items</td>
                        <td><strong>Rs.${parseFloat(order.total_amount).toLocaleString()}</strong></td>
                        <td><span class="status-badge status-${order.status}">${order.status}</span></td>
                        <td>${new Date(order.created_at).toLocaleDateString()}</td>
                        <td>
                            <div class="admin-table-actions">
                                <select onchange="updateStatus('${order.id}', this.value)" style="padding: 0.5rem; font-size: 1.2rem;">
                                    <option value="pending" ${order.status === 'pending' ? 'selected' : ''}>Pending</option>
                                    <option value="processing" ${order.status === 'processing' ? 'selected' : ''}>Processing</option>
                                    <option value="shipped" ${order.status === 'shipped' ? 'selected' : ''}>Shipped</option>
                                    <option value="delivered" ${order.status === 'delivered' ? 'selected' : ''}>Delivered</option>
                                    <option value="cancelled" ${order.status === 'cancelled' ? 'selected' : ''}>Cancelled</option>
                                </select>
                                <button class="btn btn-primary" onclick="viewOrderDetails('${order.id}')" style="padding: 0.5rem 1rem; font-size: 1.2rem;">View</button>
                                <button class="btn btn-danger" onclick="deleteOrder('${order.id}')" style="padding: 0.5rem 1rem; font-size: 1.2rem;"><i class="fa fa-trash"></i></button>
                            </div>
                        </td>
                    </tr>
                `;
            });

            html += '</tbody></table></div>';
            document.getElementById('admin-orders-table').innerHTML = html;
        }

        async function updateStatus(orderId, status) {
            const updateData = { status };
            if (status === 'shipped') {
                updateData.tracking_number = `BH${Date.now()}`;
            }

            const { error } = await supabase.from('orders').update(updateData).eq('id', orderId);
            if (error) {
                showAlert('Error updating order', 'error');
            } else {
                showAlert('Order status updated', 'success');
            }
        }

        async function viewOrderDetails(orderId) {
            const { data: order } = await supabase
                .from('orders')
                .select('*, user_profiles(*), order_items(*)')
                .eq('id', orderId)
                .single();

            if (!order) return;

            const modal = document.createElement('div');
            modal.className = 'modal-overlay active';
            modal.innerHTML = `
                <div class="modal">
                    <span class="modal-close" onclick="this.closest('.modal-overlay').remove()">&times;</span>
                    <h2>Order Details</h2>
                    <div style="margin-bottom: 2rem;">
                        <p><strong>Order ID:</strong> ${order.id}</p>
                        <p><strong>Date:</strong> ${new Date(order.created_at).toLocaleString()}</p>
                        <p><strong>Status:</strong> <span class="status-badge status-${order.status}">${order.status}</span></p>
                        ${order.tracking_number ? `<p><strong>Tracking:</strong> ${order.tracking_number}</p>` : ''}
                    </div>
                    <h3 style="margin-bottom: 1rem;">Customer Information</h3>
                    <div style="margin-bottom: 2rem; background: #f9f9f9; padding: 1rem; border-radius: 5px;">
                        <p><strong>Name:</strong> ${order.user_profiles?.full_name || 'N/A'}</p>
                        <p><strong>Phone:</strong> ${order.user_profiles?.phone || 'N/A'}</p>
                        <p><strong>Address:</strong> ${order.user_profiles?.address || 'N/A'}</p>
                    </div>
                    <h3 style="margin-bottom: 1rem;">Items</h3>
                    <div style="margin-bottom: 2rem;">
                        ${order.order_items.map(item => `
                            <div style="display: flex; justify-content: space-between; padding: 1rem 0; border-bottom: 1px solid #eee;">
                                <div>
                                    <strong>${item.product_name}</strong>
                                    <p style="font-size: 1.4rem; color: var(--light-color);">Qty: ${item.quantity}</p>
                                </div>
                                <strong>Rs.${(item.unit_price * item.quantity).toLocaleString()}</strong>
                            </div>
                        `).join('')}
                    </div>
                    <div style="text-align: right; font-size: 2rem;">
                        <strong>Total: Rs.${parseFloat(order.total_amount).toLocaleString()}</strong>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
        }

        async function deleteOrder(orderId) {
            if (!confirm('Are you sure you want to delete this order? This action cannot be undone.')) return;

            // Delete order items first
            await supabase.from('order_items').delete().eq('order_id', orderId);
            // Delete order
            const { error } = await supabase.from('orders').delete().eq('id', orderId);

            if (error) {
                showAlert('Error deleting order', 'error');
            } else {
                showAlert('Order deleted', 'success');
                loadOrders();
            }
        }
    </script>
</body>
</html>
